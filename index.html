const AI_RESPONSES={greeting:'Hallo! Ich bin Ihr medizinischer Assistent. Ich kann Ihnen allgemeine Informationen zu Ihrer OP-Vorbereitung geben. Wie kann ich helfen?',narkose:'Bei einer Narkose werden Sie in einen schlafähnlichen Zustand versetzt. Der Anästhesist überwacht dabei Ihre Vitalfunktionen. Wichtig: Halten Sie sich an die Nüchternheitsregeln!',schmerzen:'Nach einer OP sind leichte bis mittlere Schmerzen normal. Nehmen Sie die verordneten Schmerzmittel regelmäßig ein. Bei starken, zunehmenden Schmerzen kontaktieren Sie Ihre Klinik.',wunde:'Halten Sie die Wunde sauber und trocken. Verbandswechsel nur nach Anweisung. Bei Rötung, Schwellung oder Eiter sofort zum Arzt!',essen:'Vor der OP: 6-8 Stunden nichts essen, 2 Stunden nichts trinken. Nach der OP: Beginnen Sie mit leichter Kost, wenn Sie sich bereit fühlen.',medikamente:'Besprechen Sie alle Medikamente mit Ihrem Anästhesisten. Blutverdünner müssen oft pausiert werden. Nehmen Sie Dauermedikation nur nach Absprache.',angst:'Angst vor einer OP ist völlig normal. Sprechen Sie mit Ihrem Behandlungsteam darüber. Entspannungstechniken und gute Vorbereitung können helfen.',default:'Das ist eine gute Frage! Für spezifische medizinische Beratung wenden Sie sich bitte an Ihr Behandlungsteam. Ich kann Ihnen allgemeine Informationen zur OP-Vorbereitung geben.'};

let state=loadState();
let mediaRecorder=null,audioChunks=[],recordingTimer=null,recordingSeconds=0,recognition=null;

function loadState(){try{const s=localStorage.getItem(APP_KEY);if(s)return{...DEFAULT_STATE,...JSON.parse(s)};}catch(e){}return{...DEFAULT_STATE};}
function saveState(){try{localStorage.setItem(APP_KEY,JSON.stringify(state));}catch(e){showToast('Speicher voll!');}}
function setState(u){state={...state,...u};saveState();render();}
function id(){return Date.now().toString(36)+Math.random().toString(36).substr(2,5);}
function formatDate(d){if(!d)return'';return new Date(d).toLocaleDateString('de-DE',{weekday:'long',day:'numeric',month:'long',year:'numeric'});}
function formatShort(d){if(!d)return'';return new Date(d).toLocaleDateString('de-DE',{day:'2-digit',month:'2-digit',year:'2-digit'});}
function formatDT(d){if(!d)return'';return new Date(d).toLocaleDateString('de-DE',{day:'2-digit',month:'2-digit',hour:'2-digit',minute:'2-digit'});}
function formatTime(s){const m=Math.floor(s/60),sec=s%60;return`${m.toString().padStart(2,'0')}:${sec.toString().padStart(2,'0')}`;}
function getDaysUntil(){if(!state.profile.opDate)return null;const t=new Date();t.setHours(0,0,0,0);const o=new Date(state.profile.opDate);o.setHours(0,0,0,0);return Math.ceil((o-t)/(1000*60*60*24));}
function getDateFor(off){if(!state.profile.opDate)return null;const d=new Date(state.profile.opDate);d.setDate(d.getDate()+off);return d;}
function showToast(m){document.querySelector('.toast')?.remove();const t=document.createElement('div');t.className='toast';t.textContent=m;document.body.appendChild(t);setTimeout(()=>t.remove(),3000);}
function genTasks(){const tasks=[];TIMELINE.forEach(p=>{p.tasks.forEach(t=>{const ex=state.tasks.find(x=>x.id===t.id);tasks.push({...t,day:p.day,completed:ex?ex.completed:false,note:ex?ex.note:''});});});return tasks;}

function nav(s){setState({previousScreen:state.currentScreen,currentScreen:s,menuOpen:false});}
function goBack(){setState({currentScreen:state.previousScreen||'dashboard',previousScreen:'dashboard'});}
function toggleMenu(){setState({menuOpen:!state.menuOpen});}

function applyTheme(t){
    document.documentElement.setAttribute('data-theme',t);
    document.body.style.backgroundColor=t==='dark'?'#0f0d1a':'#f0f4ff';
    document.body.style.color=t==='dark'?'#f1f5f9':'#1e1b4b';
}

function toggleTheme(){
    const t=state.theme==='light'?'dark':'light';
    applyTheme(t);
    setState({theme:t});
}

function toggleTask(tid){const tasks=state.tasks.map(t=>t.id===tid?{...t,completed:!t.completed}:t);setState({tasks});showToast('Aktualisiert ✓');}
function updateNote(tid,n){const tasks=state.tasks.map(t=>t.id===tid?{...t,note:n}:t);setState({tasks});}
function toggleDoc(did){const docs=state.documents.includes(did)?state.documents.filter(d=>d!==did):[...state.documents,did];setState({documents:docs});}
function addCustomDoc(label){if(!label.trim())return;setState({customDocuments:[...state.customDocuments,{id:id(),label:label.trim(),icon:'📦'}]});showToast('Hinzugefügt ✓');}
function delCustomDoc(did){setState({customDocuments:state.customDocuments.filter(d=>d.id!==did),documents:state.documents.filter(d=>d!==did)});}
function addAppt(data){setState({appointments:[...state.appointments,{id:id(),...data}]});showToast('Termin gespeichert ✓');}
function delAppt(aid){setState({appointments:state.appointments.filter(a=>a.id!==aid)});showToast('Gelöscht');}
function addMed(data){setState({medications:[...state.medications,{id:id(),...data,alarms:data.times.map(t=>({time:t,enabled:true}))}]});showToast('Medikament gespeichert ✓');}
function delMed(mid){setState({medications:state.medications.filter(m=>m.id!==mid)});showToast('Gelöscht');}
function toggleAlarm(mid,i){const meds=state.medications.map(m=>{if(m.id===mid){const a=[...m.alarms];a[i]={...a[i],enabled:!a[i].enabled};return{...m,alarms:a};}return m;});setState({medications:meds});}

function handlePhoto(e,cat){const files=e.target.files;if(!files.length)return;Array.from(files).forEach(f=>{if(!f.type.startsWith('image/'))return showToast('Nur Bilder');const r=new FileReader();r.onload=ev=>{const img=new Image();img.onload=()=>{const c=document.createElement('canvas');const max=800;let w=img.width,h=img.height;if(w>h&&w>max){h=(h*max)/w;w=max;}else if(h>max){w=(w*max)/h;h=max;}c.width=w;c.height=h;c.getContext('2d').drawImage(img,0,0,w,h);setState({photos:[...state.photos,{id:id(),data:c.toDataURL('image/jpeg',0.7),category:cat,date:new Date().toISOString()}]});showToast('Foto gespeichert 📷');};img.src=ev.target.result;};r.readAsDataURL(f);});e.target.value='';}
function delPhoto(pid){setState({photos:state.photos.filter(p=>p.id!==pid)});showToast('Gelöscht');}
function viewPhoto(pid){const p=state.photos.find(x=>x.id===pid);if(!p)return;const v=document.createElement('div');v.className='photo-viewer';v.innerHTML=`<div class="photo-viewer-header"><span>${formatDT(p.date)}</span><button class="photo-viewer-close" onclick="this.closest('.photo-viewer').remove()">✕</button></div><div class="photo-viewer-content"><img src="${p.data}"></div>`;document.body.appendChild(v);}

function handleDocUpload(e){const files=e.target.files;if(!files.length)return;Array.from(files).forEach(f=>{const r=new FileReader();r.onload=ev=>{const doc={id:id(),name:f.name,size:f.size,type:f.type,data:ev.target.result,date:new Date().toISOString()};setState({uploadedDocs:[...state.uploadedDocs,doc]});showToast('Dokument hochgeladen 📄');};r.readAsDataURL(f);});e.target.value='';}
function delUploadedDoc(did){setState({uploadedDocs:state.uploadedDocs.filter(d=>d.id!==did)});showToast('Gelöscht');}
function formatFileSize(bytes){if(bytes<1024)return bytes+' B';if(bytes<1024*1024)return(bytes/1024).toFixed(1)+' KB';return(bytes/(1024*1024)).toFixed(1)+' MB';}

async function startRec(){try{const stream=await navigator.mediaDevices.getUserMedia({audio:true});mediaRecorder=new MediaRecorder(stream);audioChunks=[];mediaRecorder.ondataavailable=e=>audioChunks.push(e.data);mediaRecorder.onstop=()=>{const blob=new Blob(audioChunks,{type:'audio/webm'});const r=new FileReader();r.onload=e=>{setState({voiceMemos:[...state.voiceMemos,{id:id(),data:e.target.result,date:new Date().toISOString(),duration:recordingSeconds,title:`Memo ${state.voiceMemos.length+1}`}]});showToast('Sprachmemo gespeichert 🎤');};r.readAsDataURL(blob);stream.getTracks().forEach(t=>t.stop());};mediaRecorder.start();recordingSeconds=0;recordingTimer=setInterval(()=>{recordingSeconds++;const el=document.getElementById('recTimer');if(el)el.textContent=formatTime(recordingSeconds);},1000);render();}catch(e){showToast('Mikrofon nicht verfügbar');}}
function stopRec(){if(mediaRecorder&&mediaRecorder.state==='recording'){mediaRecorder.stop();clearInterval(recordingTimer);mediaRecorder=null;render();}}
function playMemo(mid){const m=state.voiceMemos.find(x=>x.id===mid);if(m)new Audio(m.data).play();}
function delMemo(mid){setState({voiceMemos:state.voiceMemos.filter(m=>m.id!==mid)});showToast('Gelöscht');}

function startSpeech(){if(!('webkitSpeechRecognition' in window)&&!('SpeechRecognition' in window))return showToast('Nicht verfügbar');const SR=window.SpeechRecognition||window.webkitSpeechRecognition;recognition=new SR();recognition.continuous=true;recognition.interimResults=true;recognition.lang='de-DE';let final='';recognition.onresult=e=>{let interim='';for(let i=e.resultIndex;i<e.results.length;i++){if(e.results[i].isFinal)final+=e.results[i][0].transcript+' ';else interim+=e.results[i][0].transcript;}const el=document.getElementById('liveText');if(el)el.textContent=final+interim;};recognition.onend=()=>{if(final.trim())setState({transcripts:[...state.transcripts,{id:id(),text:final.trim(),date:new Date().toISOString()}]});showToast('Text gespeichert ✓');recognition=null;render();};recognition.onerror=()=>{showToast('Fehler');recognition=null;render();};recognition.start();render();}
function stopSpeech(){if(recognition)recognition.stop();}
function delTranscript(tid){setState({transcripts:state.transcripts.filter(t=>t.id!==tid)});showToast('Gelöscht');}

function savePain(v){setState({painRecords:[...state.painRecords,{id:id(),date:new Date().toISOString(),value:parseInt(v)}]});showToast('Gespeichert ✓');}
function saveVitals(){const sys=parseInt(document.getElementById('sysIn')?.value),dia=parseInt(document.getElementById('diaIn')?.value),pul=parseInt(document.getElementById('pulIn')?.value);if(!sys||!dia||!pul)return showToast('Alle Werte eingeben');setState({vitalsRecords:[...state.vitalsRecords,{id:id(),date:new Date().toISOString(),systolic:sys,diastolic:dia,pulse:pul}]});showToast('Gespeichert ✓');document.getElementById('sysIn').value='';document.getElementById('diaIn').value='';document.getElementById('pulIn').value='';}
function saveMedRec(){const name=document.getElementById('medRecName')?.value,dose=document.getElementById('medRecDose')?.value;if(!name)return showToast('Medikament eingeben');setState({medicationRecords:[...state.medicationRecords,{id:id(),date:new Date().toISOString(),name,dose:dose||''}]});showToast('Dokumentiert ✓');document.getElementById('medRecName').value='';document.getElementById('medRecDose').value='';}

function addQuestion(type,text){if(!text.trim())return;const questions={...state.questions};questions[type]=[...questions[type],{id:id(),text:text.trim(),date:new Date().toISOString()}];setState({questions});showToast('Frage gespeichert ✓');}
function delQuestion(type,qid){const questions={...state.questions};questions[type]=questions[type].filter(q=>q.id!==qid);setState({questions});}

function sendChatMessage(){const input=document.getElementById('chatInput');const msg=input?.value.trim();if(!msg)return;const newMsgs=[...state.chatMessages,{role:'user',content:msg,date:new Date().toISOString()}];setState({chatMessages:newMsgs});input.value='';setTimeout(()=>{const response=getAIResponse(msg);setState({chatMessages:[...state.chatMessages,{role:'assistant',content:response,date:new Date().toISOString()}]});},800);}
function getAIResponse(msg){const lower=msg.toLowerCase();if(lower.includes('narkose')||lower.includes('betäubung'))return AI_RESPONSES.narkose;if(lower.includes('schmerz'))return AI_RESPONSES.schmerzen;if(lower.includes('wunde')||lower.includes('verband'))return AI_RESPONSES.wunde;if(lower.includes('essen')||lower.includes('trinken')||lower.includes('nüchtern'))return AI_RESPONSES.essen;if(lower.includes('medikament')||lower.includes('tablette'))return AI_RESPONSES.medikamente;if(lower.includes('angst')||lower.includes('sorge')||lower.includes('nervös'))return AI_RESPONSES.angst;if(lower.includes('hallo')||lower.includes('hi')||lower.includes('guten'))return AI_RESPONSES.greeting;return AI_RESPONSES.default;}

function painChart(){const r=state.painRecords.slice(-14);if(r.length<2)return`<div class="chart-no-data"><div class="chart-no-data-icon">📊</div><p>Mind. 2 Einträge</p></div>`;const w=280,h=140,p=30,cw=w-p*2,ch=h-p*2;const pts=r.map((x,i)=>({x:p+(i/(r.length-1))*cw,y:p+ch-(x.value/10)*ch}));const path=pts.map((pt,i)=>`${i===0?'M':'L'} ${pt.x} ${pt.y}`).join(' ');return`<svg class="chart-svg" viewBox="0 0 ${w} ${h}">${[0,5,10].map(v=>`<line x1="${p}" y1="${p+ch-(v/10)*ch}" x2="${w-p}" y2="${p+ch-(v/10)*ch}" stroke="var(--border)" stroke-dasharray="3"/><text x="${p-4}" y="${p+ch-(v/10)*ch+3}" fill="var(--muted)" font-size="9" text-anchor="end">${v}</text>`).join('')}<defs><linearGradient id="pg" x1="0%" y1="0%" x2="100%"><stop offset="0%" stop-color="var(--success)"/><stop offset="50%" stop-color="var(--warning)"/><stop offset="100%" stop-color="var(--danger)"/></linearGradient></defs><path d="${path}" fill="none" stroke="url(#pg)" stroke-width="2.5" stroke-linecap="round"/>${pts.map((pt,i)=>{const v=r[i].value,c=v<=3?'var(--success)':v<=6?'var(--warning)':'var(--danger)';return`<circle cx="${pt.x}" cy="${pt.y}" r="4" fill="${c}" stroke="white" stroke-width="1.5"/>`;}).join('')}</svg>`;}
function vitalsChart(){const r=state.vitalsRecords.slice(-10);if(r.length<2)return`<div class="chart-no-data"><div class="chart-no-data-icon">📊</div><p>Mind. 2 Einträge</p></div>`;const w=280,h=140,p=30,cw=w-p*2,ch=h-p*2,minV=50,maxV=180,range=maxV-minV;const mkPts=k=>r.map((x,i)=>({x:p+(i/(r.length-1))*cw,y:p+ch-((x[k]-minV)/range)*ch}));const sP=mkPts('systolic'),dP=mkPts('diastolic'),pP=mkPts('pulse');const mkPath=pts=>pts.map((pt,i)=>`${i===0?'M':'L'} ${pt.x} ${pt.y}`).join(' ');return`<svg class="chart-svg" viewBox="0 0 ${w} ${h}">${[60,100,140,180].map(v=>`<line x1="${p}" y1="${p+ch-((v-minV)/range)*ch}" x2="${w-p}" y2="${p+ch-((v-minV)/range)*ch}" stroke="var(--border)" stroke-dasharray="3"/>`).join('')}<path d="${mkPath(sP)}" fill="none" stroke="var(--danger)" stroke-width="2"/><path d="${mkPath(dP)}" fill="none" stroke="var(--primary)" stroke-width="2"/><path d="${mkPath(pP)}" fill="none" stroke="var(--success)" stroke-width="2"/>${sP.map(pt=>`<circle cx="${pt.x}" cy="${pt.y}" r="3" fill="var(--danger)"/>`).join('')}${dP.map(pt=>`<circle cx="${pt.x}" cy="${pt.y}" r="3" fill="var(--primary)"/>`).join('')}${pP.map(pt=>`<circle cx="${pt.x}" cy="${pt.y}" r="3" fill="var(--success)"/>`).join('')}</svg><div style="display:flex;justify-content:center;gap:10px;font-size:.7rem;margin-top:6px;"><span style="color:var(--danger)">● Sys</span><span style="color:var(--primary)">● Dia</span><span style="color:var(--success)">● Puls</span></div>`;}
function medChart(){const r=state.medicationRecords.slice(-20);if(!r.length)return`<div class="chart-no-data"><div class="chart-no-data-icon">💊</div><p>Noch keine Einträge</p></div>`;const byDay={};r.forEach(x=>{const d=new Date(x.date).toLocaleDateString('de-DE');byDay[d]=(byDay[d]||0)+1;});const days=Object.keys(byDay).slice(-7);const maxC=Math.max(...days.map(d=>byDay[d]),3);const w=280,h=120,p=25,barW=(w-p*2)/days.length-6;return`<svg class="chart-svg" viewBox="0 0 ${w} ${h}">${days.map((day,i)=>{const x=p+i*((w-p*2)/days.length)+3,ht=(byDay[day]/maxC)*(h-p*2),y=h-p-ht;return`<rect x="${x}" y="${y}" width="${barW}" height="${ht}" fill="var(--primary)" rx="3"/><text x="${x+barW/2}" y="${h-6}" fill="var(--muted)" font-size="7" text-anchor="middle">${day.split('.').slice(0,2).join('.')}</text><text x="${x+barW/2}" y="${y-3}" fill="var(--text)" font-size="9" text-anchor="middle" font-weight="bold">${byDay[day]}</text>`;}).join('')}</svg>`;}

function showModal(title,content){const m=document.createElement('div');m.className='modal-overlay';m.id='modal';m.innerHTML=`<div class="modal"><div class="modal-header"><span class="modal-title">${title}</span><button class="modal-close" onclick="closeModal()">✕</button></div>${content}</div>`;document.body.appendChild(m);}
function closeModal(){document.getElementById('modal')?.remove();}

function noteModal(tid){const t=state.tasks.find(x=>x.id===tid);showModal('📝 Notiz',`<textarea class="form-textarea" id="noteIn" rows="3" placeholder="Ihre Notiz...">${t?.note||''}</textarea><button class="btn btn-primary btn-block" style="margin-top:14px" onclick="saveNote('${tid}')">Speichern</button>`);setTimeout(()=>document.getElementById('noteIn')?.focus(),100);}
function saveNote(tid){updateNote(tid,document.getElementById('noteIn')?.value||'');closeModal();showToast('Gespeichert ✓');}
function addDocModal(){showModal('📦 Hinzufügen',`<div class="form-group"><label class="form-label">Bezeichnung</label><input type="text" class="form-input" id="newDocIn" placeholder="z.B. Kompressionsstrümpfe"></div><button class="btn btn-primary btn-block" onclick="submitDoc()">Hinzufügen</button>`);}
function submitDoc(){addCustomDoc(document.getElementById('newDocIn')?.value);closeModal();}
function apptModal(){showModal('📅 Neuer Termin',`<div class="form-group"><label class="form-label">Titel</label><input type="text" class="form-input" id="apptTitle" placeholder="z.B. Nachkontrolle"></div><div class="form-group"><label class="form-label">Datum & Uhrzeit</label><input type="datetime-local" class="form-input" id="apptDT"></div><div class="form-group"><label class="form-label">Ort (optional)</label><input type="text" class="form-input" id="apptLoc" placeholder="Klinik, Raum..."></div><div class="form-group"><label class="form-label">Notizen (optional)</label><textarea class="form-textarea" id="apptNotes" rows="2"></textarea></div><div class="checkbox-group" onclick="this.querySelector('input').click()"><input type="checkbox" id="apptReminder" checked><div class="custom-checkbox"></div><div class="checkbox-label"><div class="checkbox-title">🔔 Erinnerung</div><div class="checkbox-desc">Push-Benachrichtigung</div></div></div><button class="btn btn-primary btn-block" style="margin-top:14px" onclick="submitAppt()">Speichern</button>`);}
function submitAppt(){const title=document.getElementById('apptTitle')?.value,dt=document.getElementById('apptDT')?.value;if(!title||!dt)return showToast('Titel und Datum eingeben');addAppt({title,datetime:dt,location:document.getElementById('apptLoc')?.value||'',notes:document.getElementById('apptNotes')?.value||'',reminder:document.getElementById('apptReminder')?.checked});closeModal();}
function medModal(){showModal('💊 Medikament',`<div class="form-group"><label class="form-label">Medikament</label><input type="text" class="form-input" id="medName" placeholder="z.B. Ibuprofen"></div><div class="form-group"><label class="form-label">Dosierung</label><input type="text" class="form-input" id="medDose" placeholder="z.B. 400mg"></div><div class="form-group"><label class="form-label">Einnahmezeiten (Komma getrennt)</label><input type="text" class="form-input" id="medTimes" placeholder="08:00, 14:00, 20:00"></div><div class="form-group"><label class="form-label">Hinweise (optional)</label><textarea class="form-textarea" id="medNotes" rows="2" placeholder="z.B. Nach dem Essen"></textarea></div><button class="btn btn-primary btn-block" style="margin-top:14px" onclick="submitMed()">Speichern</button>`);}
function submitMed(){const name=document.getElementById('medName')?.value,dose=document.getElementById('medDose')?.value,times=document.getElementById('medTimes')?.value;if(!name||!times)return showToast('Name und Zeiten eingeben');addMed({name,dose:dose||'',times:times.split(',').map(t=>t.trim()).filter(t=>t),notes:document.getElementById('medNotes')?.value||''});closeModal();}
function questionModal(type){const titles={anaesthesist:'Frage an Anästhesist',operateur:'Frage an Operateur'};showModal(`❓ ${titles[type]}`,`<div class="form-group"><label class="form-label">Ihre Frage</label><textarea class="form-textarea" id="questionIn" rows="3" placeholder="Was möchten Sie wissen?"></textarea></div><button class="btn btn-primary btn-block" onclick="submitQuestion('${type}')">Speichern</button>`);}
function submitQuestion(type){addQuestion(type,document.getElementById('questionIn')?.value);closeModal();}
function dateModal(){showModal('📅 OP-Datum',`<div class="form-group"><label class="form-label">Neues Datum</label><input type="date" class="form-input" id="newDate" value="${state.profile.opDate}" min="${new Date().toISOString().split('T')[0]}"></div><p style="color:var(--muted);font-size:.85rem;margin-bottom:14px;">Timeline wird neu berechnet.</p><button class="btn btn-primary btn-block" onclick="changeDate()">Aktualisieren</button>`);}
function changeDate(){const d=document.getElementById('newDate')?.value;if(!d)return showToast('Datum wählen');setState({profile:{...state.profile,opDate:d}});closeModal();showToast('Aktualisiert ✓');}
function typeModal(){showModal('🏥 OP-Art',`<div class="form-group"><label class="form-label">Neue OP-Art</label><input type="text" class="form-input" id="newType" value="${state.profile.opType}" placeholder="z.B. Kniearthroskopie"></div><button class="btn btn-primary btn-block" style="margin-top:14px" onclick="changeType()">Aktualisieren</button>`);}
function changeType(){setState({profile:{...state.profile,opType:document.getElementById('newType')?.value||''}});closeModal();showToast('Aktualisiert ✓');}
function resetModal(){showModal('🗑️ Daten löschen',`<p style="color:var(--muted);margin-bottom:16px;line-height:1.5;">Alle Daten unwiderruflich löschen?</p><div style="display:flex;gap:10px;"><button class="btn btn-secondary" style="flex:1" onclick="closeModal()">Abbrechen</button><button class="btn btn-danger" style="flex:1" onclick="resetApp()">Löschen</button></div>`);}
function resetApp(){localStorage.removeItem(APP_KEY);state={...DEFAULT_STATE};closeModal();showToast('Gelöscht');render();}

function nextStep(){const s=state.onboardingStep;if(s===0&&(!state.profile.disclaimerAccepted||!state.profile.privacyAccepted))return showToast('Beide Hinweise akzeptieren');if(s===1){const d=document.getElementById('opDate')?.value,t=document.getElementById('opType')?.value;if(!d)return showToast('OP-Datum wählen');setState({profile:{...state.profile,opDate:d,opType:t||'Allgemeine OP'}});}if(s===2)setState({profile:{...state.profile,hospitalName:document.getElementById('hospitalName')?.value||'',hospitalPhone:document.getElementById('hospitalPhone')?.value||'',emergencyContact:document.getElementById('emergencyContact')?.value||''}});if(s===3){setState({setupComplete:true,currentScreen:'dashboard',tasks:genTasks(),onboardingStep:0,chatMessages:[{role:'assistant',content:AI_RESPONSES.greeting,date:new Date().toISOString()}]});if('Notification' in window)Notification.requestPermission();return showToast('Willkommen! 🎉');}setState({onboardingStep:s+1});}
function prevStep(){if(state.onboardingStep>0)setState({onboardingStep:state.onboardingStep-1});}

function render(){
    applyTheme(state.theme);
    const app=document.getElementById('app');
    if(!state.setupComplete){app.innerHTML=renderOnboarding();}
    else{app.innerHTML=renderHeader()+renderScreen()+(state.menuOpen?renderMenu():'')+'<button class="menu-fab" onclick="toggleMenu()">☰ Menü</button>';}
    attachListeners();
}

function renderHeader(){const back=state.currentScreen!=='dashboard';return`<header class="header">${back?'<button class="back-btn" onclick="goBack()">←</button>':''}<img src="${LOGO_BASE64}" class="logo-img" alt="Logo"><div class="logo">Operationsbegleiter</div><button class="icon-btn" onclick="toggleTheme()">${state.theme==='light'?'🌙':'☀️'}</button></header>`;}

function renderMenu(){return`<div class="menu-overlay" onclick="toggleMenu()"></div><div class="menu-drawer"><div class="menu-header"><span class="menu-title">📋 Funktionen</span><button class="menu-close" onclick="toggleMenu()">✕</button></div><div class="menu-section"><div class="menu-section-title">Hauptfunktionen</div><div class="menu-item" onclick="nav('dashboard')"><div class="menu-item-icon">🏠</div><div><h4>Startseite</h4><p>Übersicht & Countdown</p></div></div><div class="menu-item" onclick="nav('timeline')"><div class="menu-item-icon">📋</div><div><h4>Timeline</h4><p>Aufgaben vor & nach OP</p></div></div><div class="menu-item" onclick="nav('info')"><div class="menu-item-icon">ℹ️</div><div><h4>OP-Infos</h4><p>Ablauf, Vorbereitung</p></div></div><div class="menu-item" onclick="nav('warning')"><div class="menu-item-icon">⚠️</div><div><h4>Warnzeichen</h4><p>Notfall & Symptome</p></div></div></div><div class="menu-section"><div class="menu-section-title">Planung</div><div class="menu-item" onclick="nav('appointments')"><div class="menu-item-icon">📅</div><div><h4>Termine</h4><p>Nachkontrollen planen</p></div></div><div class="menu-item" onclick="nav('medications')"><div class="menu-item-icon">⏰</div><div><h4>Medikamentenplan</h4><p>Dosierung & Erinnerungen</p></div></div><div class="menu-item" onclick="nav('questions')"><div class="menu-item-icon">❓</div><div><h4>Fragen</h4><p>An Anästhesist & Operateur</p></div></div><div class="menu-item" onclick="nav('packlist')"><div class="menu-item-icon">📦</div><div><h4>Packliste</h4><p>Was Sie mitnehmen sollten</p></div></div></div><div class="menu-section"><div class="menu-section-title">Dokumentation</div><div class="menu-item" onclick="nav('photos')"><div class="menu-item-icon">📷</div><div><h4>Fotos</h4><p>Wundheilung, Aufklärungen</p></div></div><div class="menu-item" onclick="nav('documents')"><div class="menu-item-icon">📁</div><div><h4>Dokumente</h4><p>PDFs und Dateien hochladen</p></div></div><div class="menu-item" onclick="nav('voice')"><div class="menu-item-icon">🎤</div><div><h4>Sprache</h4><p>Memos & Transkription</p></div></div><div class="menu-item" onclick="nav('pain')"><div class="menu-item-icon">📊</div><div><h4>Schmerz-Tracking</h4><p>VAS-Skala & Verlauf</p></div></div><div class="menu-item" onclick="nav('vitals')"><div class="menu-item-icon">❤️</div><div><h4>Vitalwerte</h4><p>Blutdruck & Puls</p></div></div><div class="menu-item" onclick="nav('medrecords')"><div class="menu-item-icon">💊</div><div><h4>Medikamenten-Doku</h4><p>Einnahmen protokollieren</p></div></div></div><div class="menu-section"><div class="menu-item" onclick="nav('assistant')"><div class="menu-item-icon">🤖</div><div><h4>KI-Assistent</h4><p>Medizinische Fragen</p></div></div><div class="menu-item" onclick="nav('settings')"><div class="menu-item-icon">⚙️</div><div><h4>Einstellungen</h4><p>OP-Daten, Design, Daten</p></div></div></div></div>`;}

function renderScreen(){switch(state.currentScreen){case'dashboard':return renderDashboard();case'timeline':return renderTimeline();case'info':return renderInfo();case'warning':return renderWarning();case'photos':return renderPhotos();case'documents':return renderDocuments();case'voice':return renderVoice();case'pain':return renderPain();case'vitals':return renderVitals();case'medrecords':return renderMedRecords();case'appointments':return renderAppts();case'medications':return renderMeds();case'questions':return renderQuestions();case'packlist':return renderPacklist();case'assistant':return renderAssistant();case'settings':return renderSettings();default:return renderDashboard();}}

function renderOnboarding(){const steps=[{title:'Willkommen!',subtitle:'Ihr persönlicher Begleiter für die OP-Vorbereitung.',content:`<div class="checkbox-group" onclick="this.querySelector('input').click()"><input type="checkbox" id="disclaimer" ${state.profile.disclaimerAccepted?'checked':''}><div class="custom-checkbox"></div><div class="checkbox-label"><div class="checkbox-title">⚕️ Medizinischer Hinweis</div><div class="checkbox-desc">Diese App ersetzt keine ärztliche Beratung.</div></div></div><div class="checkbox-group" onclick="this.querySelector('input').click()"><input type="checkbox" id="privacy" ${state.profile.privacyAccepted?'checked':''}><div class="custom-checkbox"></div><div class="checkbox-label"><div class="checkbox-title">🔒 Datenschutz</div><div class="checkbox-desc">Alle Daten bleiben lokal auf Ihrem Gerät.</div></div></div>`},{title:'Ihre Operation',subtitle:'Wann und was wird operiert?',content:`<div class="form-group"><label class="form-label">📅 OP-Datum</label><input type="date" class="form-input" id="opDate" value="${state.profile.opDate}" min="${new Date().toISOString().split('T')[0]}"></div><div class="form-group"><label class="form-label">🏥 Art der OP</label><input type="text" class="form-input" id="opType" value="${state.profile.opType}" placeholder="z.B. Kniearthroskopie, Gallenblasen-OP"></div>`},{title:'Kontakte (optional)',subtitle:'Für den Notfall.',content:`<div class="form-group"><label class="form-label">🏥 Klinik</label><input type="text" class="form-input" id="hospitalName" value="${state.profile.hospitalName}" placeholder="Name der Klinik"></div><div class="form-group"><label class="form-label">📞 Telefon</label><input type="tel" class="form-input" id="hospitalPhone" value="${state.profile.hospitalPhone}" placeholder="030 12345678"></div><div class="form-group"><label class="form-label">👤 Notfallkontakt</label><input type="text" class="form-input" id="emergencyContact" value="${state.profile.emergencyContact}" placeholder="Name und Telefon"></div>`},{title:'Alles bereit!',subtitle:'Los geht\'s!',content:`<div style="text-align:center;padding:16px;"><div style="font-size:3.5rem;margin-bottom:14px;">🚀</div><p style="color:var(--muted);">Ihre Timeline wurde erstellt.</p></div>`}];const s=steps[state.onboardingStep];return`<div class="onboarding"><header class="header"><img src="${LOGO_BASE64}" class="logo-img" alt="Logo"><div class="logo">Operationsbegleiter</div><button class="icon-btn" onclick="toggleTheme()">${state.theme==='light'?'🌙':'☀️'}</button></header><div class="onboarding-progress">${steps.map((_,i)=>`<div class="progress-dot ${i<state.onboardingStep?'completed':''} ${i===state.onboardingStep?'active':''}"></div>`).join('')}</div><div class="onboarding-content"><div class="onboarding-hero"><img src="${LOGO_BASE64}" class="onboarding-logo" alt="Logo"><h1 class="onboarding-title">${s.title}</h1><p class="onboarding-subtitle">${s.subtitle}</p></div>${s.content}</div><div class="onboarding-nav">${state.onboardingStep>0?'<button class="btn btn-secondary" onclick="prevStep()">← Zurück</button>':''}<button class="btn btn-primary btn-block" onclick="nextStep()">${state.onboardingStep===steps.length-1?'Los geht\'s! 🎉':'Weiter →'}</button></div></div>`;}

function renderDashboard(){const d=getDaysUntil();const next=state.tasks.filter(t=>!t.completed).sort((a,b)=>a.day-b.day).slice(0,3);const appts=state.appointments.filter(a=>new Date(a.datetime)>new Date()).slice(0,2);let cv='?',cu='Kein Datum';if(d!==null){if(d<0){cv=Math.abs(d);cu='Tage seit OP';}else if(d===0){cv='🎯';cu='Heute ist OP-Tag!';}else{cv=d;cu=d===1?'Tag bis OP':'Tage bis OP';}}return`<div class="screen"><div class="hero"><div class="hero-label">🏥 ${state.profile.opType||'Ihre OP'}</div><div class="hero-value">${cv}</div><div class="hero-unit">${cu}</div><div class="hero-date">📅 ${formatDate(state.profile.opDate)}</div></div><div class="section-header"><h2 class="section-title">⚡ Schnellzugriff</h2></div><div class="grid"><div class="grid-card" onclick="nav('timeline')"><div class="grid-icon">📋</div><div class="grid-label">Timeline</div></div><div class="grid-card" onclick="nav('questions')"><div class="grid-icon">❓</div><div class="grid-label">Fragen</div></div><div class="grid-card" onclick="nav('photos')"><div class="grid-icon">📷</div><div class="grid-label">Fotos</div></div><div class="grid-card" onclick="nav('medications')"><div class="grid-icon">💊</div><div class="grid-label">Medikamente</div></div><div class="grid-card" onclick="nav('appointments')"><div class="grid-icon">📅</div><div class="grid-label">Termine</div></div><div class="grid-card" onclick="nav('assistant')"><div class="grid-icon">🤖</div><div class="grid-label">KI-Hilfe</div></div></div><div class="section-header"><h2 class="section-title">📌 Nächste Aufgaben</h2><span class="section-link" onclick="nav('timeline')">Alle →</span></div><div class="card">${next.length?next.map(t=>{const today=t.day===-d;return`<div class="card-item" onclick="nav('timeline')"><div class="badge ${today?'today':''}">${t.day===0?'OP':(t.day>0?'D+'+t.day:'D'+t.day)}</div><div class="card-content"><div class="card-title">${t.title}</div><div class="card-desc">${t.desc}</div></div></div>`;}).join(''):'<div class="card-item"><div class="card-content" style="text-align:center;padding:16px;"><div style="font-size:1.8rem;margin-bottom:8px;">🎉</div><div class="card-title">Alle erledigt!</div></div></div>'}</div>${appts.length?`<div class="section-header" style="margin-top:20px;"><h2 class="section-title">📅 Termine</h2><span class="section-link" onclick="nav('appointments')">Alle →</span></div>${appts.map(a=>{const dt=new Date(a.datetime);return`<div class="appt-card"><div class="appt-date"><div class="appt-day">${dt.getDate()}</div><div class="appt-month">${dt.toLocaleDateString('de-DE',{month:'short'})}</div></div><div class="appt-info"><div class="appt-title">${a.title}</div><div class="appt-details">${dt.toLocaleTimeString('de-DE',{hour:'2-digit',minute:'2-digit'})} Uhr${a.location?' • '+a.location:''}</div></div></div>`;}).join('')}`:''}</div>`;}

function renderTimeline(){const d=getDaysUntil();const done=state.tasks.filter(t=>t.completed).length,total=state.tasks.length,prog=total>0?Math.round((done/total)*100):0;const grouped={};state.tasks.forEach(t=>{if(!grouped[t.day])grouped[t.day]=[];grouped[t.day].push(t);});const days=Object.keys(grouped).map(Number).sort((a,b)=>a-b);const dayLabel=day=>{if(day===0)return'🎯 OP-Tag';if(day>0)return`D+${day} (Nach OP)`;return`D${day} (${Math.abs(day)} Tag${Math.abs(day)>1?'e':''} vorher)`;};return`<div class="screen"><div class="section-header"><h1 class="section-title">📋 Timeline</h1></div><div class="card" style="padding:14px;margin-bottom:16px;"><div class="progress-container"><div class="progress-label"><span>Fortschritt</span><span>${done}/${total} (${prog}%)</span></div><div class="progress-bar"><div class="progress-fill" style="width:${prog}%"></div></div></div><div class="filter-tabs"><button class="filter-tab active" data-filter="all">Alle</button><button class="filter-tab" data-filter="open">Offen</button><button class="filter-tab" data-filter="done">Erledigt</button></div></div>${d!==null&&d<=1&&d>=0?`<div class="fasting"><div class="fasting-title">🚫 Nüchternheit!</div><div class="fasting-rule"><div class="fasting-icon">🍽️</div><div class="fasting-text"><strong>8h vor OP</strong><span>Nichts essen</span></div></div><div class="fasting-rule"><div class="fasting-icon">💧</div><div class="fasting-text"><strong>2h vor OP</strong><span>Nichts trinken</span></div></div></div>`:''}<div class="timeline"><div class="timeline-line"></div>${days.map(day=>{const tasks=grouped[day];const date=getDateFor(day);const today=day===-d,op=day===0,allDone=tasks.every(t=>t.completed);return`<div class="timeline-phase"><div class="timeline-header"><div class="timeline-dot ${today?'today':''} ${op?'op':''} ${allDone&&!op?'completed':''}"></div><div><div class="phase-label">${dayLabel(day)}${today?' <span style="background:var(--warning);color:#fff;padding:2px 6px;border-radius:8px;font-size:.65rem;margin-left:6px;">HEUTE</span>':''}</div><div class="phase-date">${date?date.toLocaleDateString('de-DE',{weekday:'short',day:'numeric',month:'short'}):''}</div></div></div>${tasks.map(t=>`<div class="task ${t.completed?'completed':''}" data-id="${t.id}"><div class="task-header"><div class="task-check ${t.completed?'checked':''}" onclick="toggleTask('${t.id}')">${t.completed?'✓':''}</div><div class="task-content"><div class="task-title">${t.title}</div><div class="task-desc">${t.desc}</div>${t.note?`<div class="task-note">📝 ${t.note}</div>`:''}<button class="add-note-btn" onclick="noteModal('${t.id}')">${t.note?'✏️ Bearbeiten':'➕ Notiz'}</button></div></div></div>`).join('')}</div>`;}).join('')}</div></div>`;}

function renderInfo(){return`<div class="screen"><div class="section-header"><h1 class="section-title">ℹ️ OP-Infos</h1></div><div class="tabs"><button class="tab active" data-tab="ablauf">Ablauf</button><button class="tab" data-tab="vorbereitung">Vorbereitung</button><button class="tab" data-tab="nachsorge">Nach OP</button><button class="tab" data-tab="fragen">Fragen</button></div><div class="info-content" id="infoContent"><div class="info-section" data-content="ablauf"><h3 style="margin-bottom:12px;color:var(--text)">🔄 Ablauf</h3><ul class="info-list">${OP_INFO.ablauf.map(i=>`<li>${i}</li>`).join('')}</ul></div><div class="info-section hidden" data-content="vorbereitung"><h3 style="margin-bottom:12px;color:var(--text)">✅ Vorbereitung</h3><ul class="info-list">${OP_INFO.vorbereitung.map(i=>`<li>${i}</li>`).join('')}</ul></div><div class="info-section hidden" data-content="nachsorge"><h3 style="margin-bottom:12px;color:var(--text)">🏠 Nachsorge</h3><ul class="info-list">${OP_INFO.nachsorge.map(i=>`<li>${i}</li>`).join('')}</ul></div><div class="info-section hidden" data-content="fragen"><h3 style="margin-bottom:12px;color:var(--text)">❓ Häufige Fragen</h3>${OP_INFO.fragen.map(f=>`<div style="margin-bottom:14px;"><strong style="color:var(--text)">${f.q}</strong><p style="color:var(--muted);margin-top:4px;">${f.a}</p></div>`).join('')}</div></div><div class="disclaimer"><span>ℹ️</span><div><strong>Wichtig:</strong> Folgen Sie den Anweisungen Ihres Behandlungsteams.</div></div></div>`;}

function renderWarning(){return`<div class="screen"><div class="section-header"><h1 class="section-title">⚠️ Warnzeichen</h1></div><div class="emergency"><div class="emergency-title">🚨 Notfall?</div><p>Bei lebensbedrohlichen Symptomen!</p><a href="tel:112" class="emergency-btn">📞 112 anrufen</a></div><p style="color:var(--muted);margin-bottom:14px;">Bei diesen Zeichen Klinik kontaktieren:</p>${WARNINGS.map(w=>`<div class="warning-card"><div class="warning-icon">${w.icon}</div><div><h4>${w.title}</h4><p>${w.desc}</p></div></div>`).join('')}${state.profile.hospitalPhone?`<a href="tel:${state.profile.hospitalPhone}" class="clinic-btn">📞 ${state.profile.hospitalName||'Klinik'} anrufen</a>`:'<div class="storage-info" style="margin-top:16px;"><span>💡</span><p>Kliniktelefon in Einstellungen speichern.</p></div>'}</div>`;}

function renderQuestions(){return`<div class="screen"><div class="section-header"><h1 class="section-title">❓ Fragen</h1></div><p style="color:var(--muted);margin-bottom:16px;">Notieren Sie Ihre Fragen für die Arztgespräche.</p><div class="question-card"><div class="question-header anaesthesist"><div class="question-icon">😷</div><div class="question-header-info"><h3>Anästhesist</h3><p>Fragen zur Narkose, Betäubung & Risiken</p></div></div><div class="question-timing op-tag">⏰ Gespräch: Am OP-Tag oder 1 Tag vorher</div><div class="question-body">${state.questions.anaesthesist.length?state.questions.anaesthesist.map(q=>`<div class="question-item"><span class="question-bullet">•</span><span class="question-text">${q.text}</span><button class="question-del" onclick="delQuestion('anaesthesist','${q.id}')">✕</button></div>`).join(''):'<div class="question-empty">Noch keine Fragen notiert.</div>'}<button class="btn btn-secondary btn-block btn-sm" onclick="questionModal('anaesthesist')">➕ Frage hinzufügen</button></div></div><div class="question-card"><div class="question-header operateur"><div class="question-icon">👨‍⚕️</div><div class="question-header-info"><h3>Operateur / Chirurg</h3><p>Fragen zur OP, Ablauf & Nachsorge</p></div></div><div class="question-timing vor-op">⏰ Aufklärungsgespräch: Tage/Wochen vor OP</div><div class="question-timing nach-op" style="margin-left:8px;">⏰ Nachgespräch: Nach der OP</div><div class="question-body">${state.questions.operateur.length?state.questions.operateur.map(q=>`<div class="question-item"><span class="question-bullet">•</span><span class="question-text">${q.text}</span><button class="question-del" onclick="delQuestion('operateur','${q.id}')">✕</button></div>`).join(''):'<div class="question-empty">Noch keine Fragen notiert.</div>'}<button class="btn btn-secondary btn-block btn-sm" onclick="questionModal('operateur')">➕ Frage hinzufügen</button></div></div><div class="disclaimer"><span>💡</span><div>Tipp: Notieren Sie Ihre Fragen im Voraus, damit Sie im Gespräch nichts vergessen!</div></div></div>`;}

function renderPhotos(){const wound=state.photos.filter(p=>p.category==='wound'),consent=state.photos.filter(p=>p.category==='consent'),other=state.photos.filter(p=>p.category==='other');return`<div class="screen"><div class="section-header"><h1 class="section-title">📷 Fotos</h1></div><div style="margin-bottom:20px;"><h3 style="margin-bottom:10px;color:var(--text)">🩹 Wundheilung</h3><div class="upload-area" onclick="document.getElementById('woundUp').click()"><div class="upload-icon">📷</div><div class="upload-text">Foto aufnehmen</div></div><input type="file" id="woundUp" class="file-input" accept="image/*" capture="environment" multiple onchange="handlePhoto(event,'wound')">${wound.length?`<div class="photo-grid">${wound.map(p=>`<div class="photo-item" onclick="viewPhoto('${p.id}')"><img src="${p.data}"><div class="photo-date">${formatShort(p.date)}</div><button class="photo-delete" onclick="event.stopPropagation();delPhoto('${p.id}')">✕</button></div>`).join('')}</div>`:''}</div><div style="margin-bottom:20px;"><h3 style="margin-bottom:10px;color:var(--text)">📄 OP-Aufklärungen</h3><div class="upload-area" onclick="document.getElementById('consentUp').click()"><div class="upload-icon">📋</div><div class="upload-text">Dokument fotografieren</div></div><input type="file" id="consentUp" class="file-input" accept="image/*" capture="environment" multiple onchange="handlePhoto(event,'consent')">${consent.length?`<div class="photo-grid">${consent.map(p=>`<div class="photo-item" onclick="viewPhoto('${p.id}')"><img src="${p.data}"><div class="photo-date">${formatShort(p.date)}</div><button class="photo-delete" onclick="event.stopPropagation();delPhoto('${p.id}')">✕</button></div>`).join('')}</div>`:''}</div><div><h3 style="margin-bottom:10px;color:var(--text)">📎 Sonstiges</h3><div class="upload-area" onclick="document.getElementById('otherUp').click()"><div class="upload-icon">🖼️</div><div class="upload-text">Weitere Fotos</div></div><input type="file" id="otherUp" class="file-input" accept="image/*" capture="environment" multiple onchange="handlePhoto(event,'other')">${other.length?`<div class="photo-grid">${other.map(p=>`<div class="photo-item" onclick="viewPhoto('${p.id}')"><img src="${p.data}"><div class="photo-date">${formatShort(p.date)}</div><button class="photo-delete" onclick="event.stopPropagation();delPhoto('${p.id}')">✕</button></div>`).join('')}</div>`:''}</div></div>`;}

function renderDocuments(){return`<div class="screen"><div class="section-header"><h1 class="section-title">📁 Dokumente</h1></div><p style="color:var(--muted);margin-bottom:16px;">Laden Sie wichtige Dokumente hoch (PDFs, Arztbriefe, etc.)</p><div class="upload-area" onclick="document.getElementById('docUp').click()"><div class="upload-icon">📄</div><div class="upload-text">Dokument hochladen<br><small>PDF, Word, Bilder</small></div></div><input type="file" id="docUp" class="file-input" accept=".pdf,.doc,.docx,.jpg,.jpeg,.png" multiple onchange="handleDocUpload(event)">${state.uploadedDocs.length?`<div style="margin-top:16px;">${state.uploadedDocs.map(d=>`<div class="doc-file"><div class="doc-file-icon">${d.type.includes('pdf')?'📕':d.type.includes('word')||d.type.includes('doc')?'📘':'🖼️'}</div><div class="doc-file-info"><div class="doc-file-name">${d.name}</div><div class="doc-file-meta">${formatFileSize(d.size)} • ${formatShort(d.date)}</div></div><button class="doc-file-del" onclick="delUploadedDoc('${d.id}')">🗑️</button></div>`).join('')}</div>`:'<div class="storage-info" style="margin-top:16px;"><span>📂</span><p>Noch keine Dokumente hochgeladen.</p></div>'}</div>`;}

function renderVoice(){const isRec=mediaRecorder&&mediaRecorder.state==='recording',isListen=recognition!==null;return`<div class="screen"><div class="section-header"><h1 class="section-title">🎤 Sprache</h1></div><div style="margin-bottom:20px;"><h3 style="margin-bottom:10px;color:var(--text)">🎙️ Sprache zu Text</h3><p style="color:var(--muted);font-size:.85rem;margin-bottom:12px;">Arzt-Gespräche direkt in Text umwandeln.</p><button class="speech-btn ${isListen?'listening':''}" onclick="${isListen?'stopSpeech()':'startSpeech()'}">${isListen?'⏹️ Stoppen':'🎤 Aufnahme starten'}</button>${isListen?'<div id="liveText" style="margin-top:14px;padding:14px;background-color:var(--bg);border-radius:var(--radius);min-height:60px;color:var(--text)">Sprechen Sie...</div>':''}${state.transcripts.length?`<h4 style="margin:16px 0 10px;color:var(--text)">📝 Texte</h4>${state.transcripts.map(t=>`<div class="transcript-item"><div class="transcript-header"><span class="transcript-date">${formatDT(t.date)}</span><button class="transcript-delete" onclick="delTranscript('${t.id}')">🗑️</button></div><div class="transcript-text">${t.text}</div></div>`).join('')}`:''}</div><div><h3 style="margin-bottom:10px;color:var(--text)">🎤 Sprachmemos</h3><div class="recording-controls"><button class="record-btn ${isRec?'recording':''}" onclick="${isRec?'stopRec()':'startRec()'}">${isRec?'⏹️':'🎤'}</button><div class="recording-status ${isRec?'active':''}">${isRec?'Aufnahme...':'Tippen zum Aufnehmen'}</div>${isRec?'<div class="recording-timer" id="recTimer">00:00</div>':''}</div>${state.voiceMemos.length?state.voiceMemos.map(m=>`<div class="memo-item"><button class="play-btn" onclick="playMemo('${m.id}')">▶️</button><div class="memo-info"><div class="memo-title">${m.title}</div><div class="memo-meta">${formatDT(m.date)} • ${formatTime(m.duration)}</div></div><button class="memo-delete" onclick="delMemo('${m.id}')">🗑️</button></div>`).join(''):''}</div></div>`;}

function renderPain(){return`<div class="screen"><div class="section-header"><h1 class="section-title">📊 Schmerz</h1></div><div class="vas-container"><h3 class="vas-title">😣 Aktuelle Schmerzen</h3><p style="color:var(--muted);font-size:.85rem;margin-bottom:12px;">0 = keine, 10 = unerträglich</p><div class="vas-scale"><span class="vas-label">Kein</span><input type="range" class="vas-slider" id="painSlider" min="0" max="10" value="0" oninput="document.getElementById('painVal').textContent=this.value"><span class="vas-value" id="painVal">0</span></div><div class="vas-emojis"><span>😊</span><span>😐</span><span>😣</span><span>😖</span><span>😫</span></div><button class="btn btn-primary btn-block" style="margin-top:16px;" onclick="savePain(document.getElementById('painSlider').value)">💾 Speichern</button></div><div class="chart-container"><div class="chart-title">📈 Verlauf</div><div class="chart-canvas">${painChart()}</div></div>${state.painRecords.length?`<div style="margin-top:16px;"><h4 style="margin-bottom:10px;color:var(--text)">📋 Letzte Einträge</h4>${state.painRecords.slice(-5).reverse().map(r=>`<div style="display:flex;justify-content:space-between;padding:8px 0;border-bottom:1px solid var(--border);"><span style="color:var(--text)">${formatDT(r.date)}</span><span style="font-weight:700;color:${r.value<=3?'var(--success)':r.value<=6?'var(--warning)':'var(--danger)'};">${r.value}/10</span></div>`).join('')}</div>`:''}</div>`;}

function renderVitals(){return`<div class="screen"><div class="section-header"><h1 class="section-title">❤️ Vitalwerte</h1></div><div class="vas-container"><h3 class="vas-title">📏 Neue Messung</h3><div class="vitals-row"><div class="vitals-group"><label>Systolisch</label><input type="number" id="sysIn" placeholder="120"></div><div class="vitals-group"><label>Diastolisch</label><input type="number" id="diaIn" placeholder="80"></div></div><div class="vitals-row"><div class="vitals-group"><label>Puls (bpm)</label><input type="number" id="pulIn" placeholder="70"></div></div><button class="btn btn-primary btn-block" style="margin-top:12px;" onclick="saveVitals()">💾 Speichern</button></div><div class="chart-container"><div class="chart-title">📈 Verlauf</div><div class="chart-canvas">${vitalsChart()}</div></div>${state.vitalsRecords.length?`<div style="margin-top:16px;"><h4 style="margin-bottom:10px;color:var(--text)">📋 Messungen</h4>${state.vitalsRecords.slice(-5).reverse().map(r=>`<div style="display:flex;justify-content:space-between;align-items:center;padding:10px 0;border-bottom:1px solid var(--border);"><span style="font-size:.85rem;color:var(--muted);">${formatDT(r.date)}</span><div style="display:flex;gap:12px;"><span style="color:var(--danger);font-weight:600;">${r.systolic}/${r.diastolic}</span><span style="color:var(--success);font-weight:600;">❤️ ${r.pulse}</span></div></div>`).join('')}</div>`:''}</div>`;}

function renderMedRecords(){return`<div class="screen"><div class="section-header"><h1 class="section-title">💊 Medikamenten-Doku</h1></div><div class="vas-container"><h3 class="vas-title">📝 Einnahme dokumentieren</h3><div class="form-group"><label class="form-label">Medikament</label><input type="text" class="form-input" id="medRecName" placeholder="z.B. Ibuprofen"></div><div class="form-group"><label class="form-label">Dosis (optional)</label><input type="text" class="form-input" id="medRecDose" placeholder="z.B. 400mg"></div><button class="btn btn-primary btn-block" onclick="saveMedRec()">💊 Dokumentieren</button></div><div class="chart-container"><div class="chart-title">📊 Einnahmen/Tag</div><div class="chart-canvas">${medChart()}</div></div>${state.medicationRecords.length?`<div style="margin-top:16px;"><h4 style="margin-bottom:10px;color:var(--text)">📋 Letzte</h4>${state.medicationRecords.slice(-10).reverse().map(r=>`<div style="display:flex;align-items:center;gap:10px;padding:10px 0;border-bottom:1px solid var(--border);"><span style="font-size:1.2rem;">💊</span><div style="flex:1;"><div style="font-weight:600;font-size:.9rem;color:var(--text)">${r.name}${r.dose?' ('+r.dose+')':''}</div><div style="font-size:.8rem;color:var(--muted);">${formatDT(r.date)}</div></div></div>`).join('')}</div>`:''}</div>`;}

function renderAppts(){const upcoming=state.appointments.filter(a=>new Date(a.datetime)>=new Date()).sort((a,b)=>new Date(a.datetime)-new Date(b.datetime));const past=state.appointments.filter(a=>new Date(a.datetime)<new Date()).sort((a,b)=>new Date(b.datetime)-new Date(a.datetime));return`<div class="screen"><div class="section-header"><h1 class="section-title">📅 Termine</h1></div><button class="btn btn-primary btn-block" style="margin-bottom:16px;" onclick="apptModal()">➕ Termin hinzufügen</button>${upcoming.length?`<h3 style="margin-bottom:10px;color:var(--text)">📌 Kommende</h3>${upcoming.map(a=>{const dt=new Date(a.datetime);return`<div class="appt-card"><div class="appt-date"><div class="appt-day">${dt.getDate()}</div><div class="appt-month">${dt.toLocaleDateString('de-DE',{month:'short'})}</div></div><div class="appt-info"><div class="appt-title">${a.title}</div><div class="appt-details">${dt.toLocaleTimeString('de-DE',{hour:'2-digit',minute:'2-digit'})} Uhr${a.location?' • '+a.location:''}${a.reminder?' • 🔔':''}</div>${a.notes?`<div style="font-size:.75rem;color:var(--muted);margin-top:3px;">${a.notes}</div>`:''}</div><button class="appt-delete" onclick="delAppt('${a.id}')">🗑️</button></div>`;}).join('')}`:'<div class="storage-info" style="margin-bottom:16px;"><span>📅</span><p>Keine Termine. Nachkontrollen hinzufügen!</p></div>'}${past.length?`<h3 style="margin:16px 0 10px;color:var(--muted);">📜 Vergangene</h3>${past.slice(0,5).map(a=>{const dt=new Date(a.datetime);return`<div class="appt-card" style="opacity:.5;"><div class="appt-date" style="background:var(--muted);"><div class="appt-day">${dt.getDate()}</div><div class="appt-month">${dt.toLocaleDateString('de-DE',{month:'short'})}</div></div><div class="appt-info"><div class="appt-title">${a.title}</div><div class="appt-details">${dt.toLocaleTimeString('de-DE',{hour:'2-digit',minute:'2-digit'})} Uhr</div></div></div>`;}).join('')}`:''}</div>`;}

function renderMeds(){return`<div class="screen"><div class="section-header"><h1 class="section-title">⏰ Medikamentenplan</h1></div><button class="btn btn-primary btn-block" style="margin-bottom:16px;" onclick="medModal()">➕ Medikament hinzufügen</button>${state.medications.length?state.medications.map(m=>`<div class="med-card"><div class="med-header"><div><div class="med-name">💊 ${m.name}</div><div class="med-dose">${m.dose}${m.notes?' • '+m.notes:''}</div></div><button class="appt-delete" onclick="delMed('${m.id}')">🗑️</button></div><div class="med-times">${m.alarms.map((a,i)=>`<div class="med-time" onclick="toggleAlarm('${m.id}',${i})"><div class="alarm-dot ${a.enabled?'':'off'}"></div><span>${a.time}</span></div>`).join('')}</div></div>`).join(''):'<div class="storage-info"><span>💊</span><p>Keine Medikamente. Plan erstellen!</p></div>'}<div class="disclaimer" style="margin-top:16px;"><span>🔔</span><div>Tippen Sie auf eine Uhrzeit um die Erinnerung ein/auszuschalten.</div></div></div>`;}

function renderPacklist(){const allDocs=[...DEFAULT_DOCS,...state.customDocuments];return`<div class="screen"><div class="section-header"><h1 class="section-title">📦 Packliste</h1></div><p style="color:var(--muted);margin-bottom:14px;">Was Sie für die OP mitnehmen sollten:</p><div class="card">${allDocs.map(d=>`<div class="doc-item ${state.documents.includes(d.id)?'checked':''}" onclick="toggleDoc('${d.id}')"><div class="doc-check">${state.documents.includes(d.id)?'✓':''}</div><div class="doc-icon">${d.icon}</div><div class="doc-label">${d.label}</div>${!DEFAULT_DOCS.find(x=>x.id===d.id)?`<button class="doc-delete" onclick="event.stopPropagation();delCustomDoc('${d.id}')">🗑️</button>`:''}</div>`).join('')}</div><button class="btn btn-secondary btn-block" style="margin-top:12px;" onclick="addDocModal()">➕ Eigenen Eintrag hinzufügen</button><button class="btn btn-secondary btn-block" style="margin-top:10px;" onclick="window.print()">🖨️ Liste drucken</button></div>`;}

function renderAssistant(){return`<div class="screen"><div class="section-header"><h1 class="section-title">🤖 KI-Assistent</h1></div><div class="chat-container"><div class="chat-header"><div class="chat-header-icon">🤖</div><div class="chat-header-text"><h3>Medizin-Assistent</h3><p>Fragen zur OP-Vorbereitung</p></div></div><div class="chat-messages" id="chatMessages">${state.chatMessages.map(m=>`<div class="chat-message ${m.role}"><div class="chat-bubble">${m.content}</div></div>`).join('')}</div><div class="chat-input-area"><input type="text" class="chat-input" id="chatInput" placeholder="Ihre Frage..." onkeypress="if(event.key==='Enter')sendChatMessage()"><button class="chat-send" onclick="sendChatMessage()">➤</button></div><div class="chat-disclaimer">⚠️ Dieser Assistent gibt nur allgemeine Informationen. Bei medizinischen Fragen wenden Sie sich an Ihr Behandlungsteam.</div></div></div>`;}

function renderSettings(){return`<div class="screen"><div class="section-header"><h1 class="section-title">⚙️ Einstellungen</h1></div><h3 style="font-size:.8rem;color:var(--muted);text-transform:uppercase;margin-bottom:10px;">OP-Daten</h3><div class="settings-card"><div class="settings-item"><div class="settings-label"><div class="settings-icon">📅</div><div class="settings-text"><h4>OP-Datum</h4><p>${formatDate(state.profile.opDate)||'Nicht gesetzt'}</p></div></div><button class="btn btn-secondary btn-sm" onclick="dateModal()">Ändern</button></div><div class="settings-item"><div class="settings-label"><div class="settings-icon">🏥</div><div class="settings-text"><h4>OP-Art</h4><p>${state.profile.opType||'Nicht gesetzt'}</p></div></div><button class="btn btn-secondary btn-sm" onclick="typeModal()">Ändern</button></div></div><h3 style="font-size:.8rem;color:var(--muted);text-transform:uppercase;margin:16px 0 10px;">Darstellung</h3><div class="settings-card"><div class="settings-item"><div class="settings-label"><div class="settings-icon">${state.theme==='dark'?'🌙':'☀️'}</div><div class="settings-text"><h4>Dunkler Modus</h4><p>Weniger Augenbelastung</p></div></div><label class="toggle"><input type="checkbox" ${state.theme==='dark'?'checked':''} onchange="toggleTheme()"><span class="toggle-slider"></span></label></div></div><h3 style="font-size:.8rem;color:var(--muted);text-transform:uppercase;margin:16px 0 10px;">Daten</h3><div class="settings-card"><div class="settings-item" style="flex-direction:column;align-items:stretch;gap:10px;"><p style="font-size:.85rem;color:var(--muted);">📷 ${state.photos.length} Fotos • 🎤 ${state.voiceMemos.length} Memos • 📄 ${state.uploadedDocs.length} Dokumente</p><button class="btn btn-danger btn-block" onclick="resetModal()">🗑️ Alle Daten löschen</button></div></div><div class="storage-info" style="margin-top:16px;"><span>🔒</span><p>Alle Daten bleiben lokal auf diesem Gerät.</p></div></div>`;}

function attachListeners(){document.querySelectorAll('#disclaimer,#privacy').forEach(el=>{el?.addEventListener('change',e=>{const p={...state.profile};if(e.target.id==='disclaimer')p.disclaimerAccepted=e.target.checked;if(e.target.id==='privacy')p.privacyAccepted=e.target.checked;setState({profile:p});});});document.querySelectorAll('.tab').forEach(t=>{t.addEventListener('click',e=>{const tab=e.target.dataset.tab;document.querySelectorAll('.tab').forEach(x=>x.classList.remove('active'));e.target.classList.add('active');document.querySelectorAll('.info-section').forEach(s=>s.classList.add('hidden'));document.querySelector(`[data-content="${tab}"]`)?.classList.remove('hidden');});});document.querySelectorAll('.filter-tab').forEach(t=>{t.addEventListener('click',e=>{const f=e.target.dataset.filter;document.querySelectorAll('.filter-tab').forEach(x=>x.classList.remove('active'));e.target.classList.add('active');document.querySelectorAll('.task').forEach(task=>{const done=task.classList.contains('completed');if(f==='all')task.style.display='';else if(f==='open')task.style.display=done?'none':'';else task.style.display=done?'':'none';});});});const chatMsgs=document.getElementById('chatMessages');if(chatMsgs)chatMsgs.scrollTop=chatMsgs.scrollHeight;}

document.addEventListener('DOMContentLoaded',()=>{render();});

window.toggleTheme=toggleTheme;window.toggleTask=toggleTask;window.toggleDoc=toggleDoc;window.nav=nav;window.goBack=goBack;window.toggleMenu=toggleMenu;window.nextStep=nextStep;window.prevStep=prevStep;window.noteModal=noteModal;window.saveNote=saveNote;window.addDocModal=addDocModal;window.submitDoc=submitDoc;window.delCustomDoc=delCustomDoc;window.apptModal=apptModal;window.submitAppt=submitAppt;window.delAppt=delAppt;window.medModal=medModal;window.submitMed=submitMed;window.delMed=delMed;window.toggleAlarm=toggleAlarm;window.dateModal=dateModal;window.changeDate=changeDate;window.typeModal=typeModal;window.changeType=changeType;window.resetModal=resetModal;window.resetApp=resetApp;window.closeModal=closeModal;window.handlePhoto=handlePhoto;window.delPhoto=delPhoto;window.viewPhoto=viewPhoto;window.handleDocUpload=handleDocUpload;window.delUploadedDoc=delUploadedDoc;window.startRec=startRec;window.stopRec=stopRec;window.playMemo=playMemo;window.delMemo=delMemo;window.startSpeech=startSpeech;window.stopSpeech=stopSpeech;window.delTranscript=delTranscript;window.savePain=savePain;window.saveVitals=saveVitals;window.saveMedRec=saveMedRec;window.questionModal=questionModal;window.submitQuestion=submitQuestion;window.addQuestion=addQuestion;window.delQuestion=delQuestion;window.sendChatMessage=sendChatMessage;
</script>
</body>
</html>
